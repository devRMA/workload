name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

permissions:
  contents: read

jobs:
  checks:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      - name: Biome (Lint & Format)
        run: pnpm exec biome ci .

      - name: TypeScript check
        run: pnpm typecheck

      - name: Run Vitest
        run: pnpm test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Unit Tests Report
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: success() || failure()
        with:
          name: Unit Tests Report
          path: coverage/junit.xml
          reporter: java-junit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@f2274c2c340e0c81c8f7dc407b2a477b8935f171 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  playwright:
    name: Playwright
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    env:
      NEXT_PUBLIC_GA_ID: "G-TEST12345"
      NEXT_PUBLIC_ENABLE_ADS: "true"
      NEXT_PUBLIC_ADSENSE_ID: "ca-pub-0000000000000000"
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      - name: Verify Playwright image compatibility
        run: |
          installed_version=$(node -p 'require("@playwright/test/package.json").version')
          if [ "$installed_version" != "1.63.0" ]; then
            echo "::error::Update the Playwright container tag to match $installed_version"
            exit 1
          fi

      - name: Cache Next.js compilation
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-e2e-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-e2e-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build Next.js
        timeout-minutes: 5
        run: pnpm build

      - name: Run Playwright
        timeout-minutes: 10
        run: pnpm e2e

      - name: E2E Tests Report
        uses: dorny/test-reporter@1cc81a5edf733718d4850df304aaa21c05cd7280 # v3
        if: ${{ !cancelled() && hashFiles('playwright-report/results.xml') != '' }}
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: ${{ github.workspace }}
        with:
          name: E2E Tests Report
          path: playwright-report/results.xml
          reporter: java-junit

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    env:
      NEXT_PUBLIC_GA_ID: ""
      NEXT_PUBLIC_ENABLE_ADS: "false"
      NEXT_PUBLIC_ADSENSE_ID: ""
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        timeout-minutes: 3
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js compilation
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-lighthouse-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-lighthouse-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build without third-party scripts
        timeout-minutes: 5
        run: pnpm build

      - name: Run Lighthouse CI
        timeout-minutes: 8
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec lhci autorun

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-24.04
    needs: [checks, playwright, lighthouse]
    if: ${{ always() }}
    timeout-minutes: 1
    steps:
      - name: Require all CI jobs to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
        run: test "$CHECKS_RESULT" = success && test "$PLAYWRIGHT_RESULT" = success && test "$LIGHTHOUSE_RESULT" = success
